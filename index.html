<!DOCTYPE html>

<html>

<head>

  <title>Our Anniversary 💖</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: linear-gradient(135deg, #ffe6f0, #fff0f5);

      text-align: center;

      overflow-x: hidden;

    }

    h1 {

      color: #d63384;

      font-size: 40px;

      margin-top: 30px;

    }

    p {

      color: #444;

      font-size: 18px;

      padding: 0 20px;

    }

    .box {

      background: white;

      margin: 20px auto;

      padding: 20px;

      border-radius: 15px;

      max-width: 500px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.1);

    }

    .gallery {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;

      padding: 20px;

    }

    .gallery img {

      width: 160px;

      border-radius: 15px;

      box-shadow: 0 4px 10px rgba(0,0,0,0.2);

      transition: transform 0.3s;

    }

    .gallery img:hover {

      transform: scale(1.08);

    }

    /* Floating hearts */

    .heart {

      position: absolute;

      color: #ff4d88;

      animation: floatUp 6s infinite;

      font-size: 20px;

    }

    @keyframes floatUp {

      0% { transform: translateY(100vh); opacity: 0; }

      50% { opacity: 1; }

      100% { transform: translateY(-10vh); opacity: 0; }

    }

  </style>

</head>

<body>

  <h1>Happy Anniversary 💖</h1>

  <div class="box">

    <p>

      Every moment with you feels special.  

      This website is just a small way of showing my love for you 💕

    </p>

  </div>

  <h2>Our Memories 📸</h2>

  <div class="gallery">

    <img src="IMG_0406.jpeg">

    <img src="IMG_0408.jpeg">

    <img src="IMG_0412.jpeg">

    <img src="IMG_0754.jpeg">

    <img src="IMG_0756.jpeg">

    <img src="IMG_0757.jpeg">

    <img src="IMG_0758.jpeg">

    <img src="IMG_0761.jpeg">

    <img src="IMG_0762.jpeg">

    <img src="IMG_0763.jpeg">

  </div>

  <div class="box">

    <p>

      Thank you for loving me, supporting me, and being my happiness 💗

    </p>

  </div>

  <!-- Floating hearts script -->

  <script>

    function createHeart() {

      const heart = document.createElement("div");

      heart.innerHTML = "💖";

      heart.classList.add("heart");

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {

        heart.remove();

      }, 6000);

    }

    setInterval(createHeart, 500);

  </script>

</body>

</html>
