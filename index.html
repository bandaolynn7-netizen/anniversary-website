<!DOCTYPE html>

<html>

<head>

  <title>Our Anniversary 💖</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: linear-gradient(135deg, #ffe6f0, #fff0f5);

      text-align: center;

      overflow-x: hidden;

    }

    /* INTRO */

    #intro {

      position: fixed;

      width: 100%;

      height: 100vh;

      background: linear-gradient(135deg, #ff4d88, #ff99cc);

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      z-index: 999;

      color: white;

    }

    #intro button {

      padding: 12px 25px;

      border: none;

      border-radius: 25px;

      font-size: 16px;

      cursor: pointer;

      background: white;

      color: #d63384;

      margin-top: 10px;

    }

    h1 {

      color: #d63384;

      margin-top: 20px;

    }

    .box {

      background: white;

      margin: 20px auto;

      padding: 20px;

      border-radius: 15px;

      max-width: 500px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.1);

    }

    /* GALLERY */

    .gallery {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));

      gap: 10px;

      padding: 20px;

      max-width: 900px;

      margin: auto;

    }

    .gallery img {

      width: 100%;

      border-radius: 15px;

      transition: transform 0.3s;

    }

    .gallery img:hover {

      transform: scale(1.1);

    }

    /* HEARTS */

    .heart {

      position: fixed;

      color: #ff4d88;

      font-size: 18px;

      animation: floatUp 6s linear infinite;

    }

    @keyframes floatUp {

      0% { transform: translateY(100vh); opacity: 0; }

      50% { opacity: 1; }

      100% { transform: translateY(-10vh); opacity: 0; }

    }

    /* POPUP */

    #popup {

      position: fixed;

      bottom: 20px;

      right: 20px;

      background: white;

      padding: 15px;

      border-radius: 15px;

      box-shadow: 0 4px 10px rgba(0,0,0,0.2);

      display: none;

    }

  </style>

</head>

<body>

<!-- INTRO -->

<div id="intro">

  <h1>💖 Welcome My Love 💖</h1>

  <button onclick="startSite()">Enter Our Story</button>

</div>

<!-- CONTENT -->

<div id="content" style="display:none;">

  <h1>Our Love Story 💕</h1>

  <div class="box">

    <p>This is our space full of memories, love, and happiness 💖</p>

  </div>

  <!-- TIMER -->

  <div class="box">

    <h2>⏳ Time Together</h2>

    <p id="timer"></p>

  </div>

  <h2>Memories 📸</h2>

  <div class="gallery">

    <img src="IMG_0406.jpeg">

    <img src="IMG_0408.jpeg">

    <img src="IMG_0412.jpeg">

    <img src="IMG_0754.jpeg">

    <img src="IMG_0756.jpeg">

    <img src="IMG_0757.jpeg">

    <img src="IMG_0758.jpeg">

    <img src="IMG_0761.jpeg">

    <img src="IMG_0762.jpeg">

    <img src="IMG_0763.jpeg">

  </div>

</div>

<!-- POPUP -->

<div id="popup">💌 I love you forever 💖</div>

<script>

function startSite() {

  document.getElementById("intro").style.display = "none";

  document.getElementById("content").style.display = "block";

  document.getElementById("popup").style.display = "block";

}

/* FLOATING HEARTS */

setInterval(() => {

  const heart = document.createElement("div");

  heart.classList.add("heart");

  heart.innerHTML = "💖";

  heart.style.left = Math.random() * 100 + "vw";

  heart.style.animationDuration = (3 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);

}, 300);

/* TIMER - START DATE UPDATED */

const startDate = new Date("2024-07-21");

setInterval(() => {

  const now = new Date();

  const diff = now - startDate;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  document.getElementById("timer").innerHTML =

    days + " days of love 💖";

}, 1000);

</script>

</body>

</html>
