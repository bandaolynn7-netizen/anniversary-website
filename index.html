<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Happy Anniversary Isubilo ❤️</<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:'Poppins',sans-serif;

background:linear-gradient(135deg,#ffd6e8,#d8c8ff,#cce7ff);

overflow-x:hidden;

color:white;

}

.hero{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

position:relative;

}

.hero::before{

content:'';

position:absolute;

inset:0;

background:url('mirror.jpg') center/cover no-repeat;

opacity:0.25;

z-index:-1;

}

h1{

font-family:'Great Vibes',cursive;

font-size:4rem;

margin-bottom:20px;

text-shadow:0 0 15px rgba(255,255,255,0.5);

}

.subtitle{

font-size:1.2rem;

max-width:700px;

line-height:1.8;

background:rgba(255,255,255,0.15);

padding:20px;

border-radius:20px;

backdrop-filter:blur(10px);

}

.btn{

margin-top:30px;

padding:15px 35px;

border:none;

border-radius:40px;

font-size:1rem;

background:#ff5fa2;

color:white;

cursor:pointer;

transition:0.3s;

box-shadow:0 0 20px rgba(255,95,162,0.5);

}

.btn:hover{

transform:scale(1.05);

}

.section{

padding:80px 20px;

text-align:center;

}

.section h2{

font-size:2.5rem;

margin-bottom:20px;

font-family:'Great Vibes',cursive;

}

.memory-card{

max-width:800px;

margin:auto;

background:rgba(255,255,255,0.15);

padding:30px;

border-radius:25px;

backdrop-filter:blur(10px);

line-height:1.8;

}

.gallery{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:20px;

margin-top:40px;

}

.gallery img{

width:280px;

border-radius:20px;

box-shadow:0 0 20px rgba(0,0,0,0.2);

transition:0.3s;

}

.gallery img:hover{

transform:scale(1.05);

}

.countdown{

font-size:2rem;

margin-top:20px;

}

.popup{

position:fixed;

bottom:20px;

right:20px;

background:#ff5fa2;

padding:15px 20px;

border-radius:15px;

display:none;

box-shadow:0 0 20px rgba(0,0,0,0.3);

animation:fadeIn 0.5s ease;

}

@keyframes fadeIn{

from{opacity:0; transform:translateY(20px);}

to{opacity:1; transform:translateY(0);}

}

.hearts{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

pointer-events:none;

overflow:hidden;

}

.heart{

position:absolute;

color:white;

animation:float 6s linear infinite;

font-size:20px;

}

@keyframes float{

0%{

transform:translateY(100vh) scale(0);

opacity:0;

}

50%{

opacity:1;

}

100%{

transform:translateY(-10vh) scale(1);

opacity:0;

}

}

.footer{

padding:30px;

text-align:center;

font-size:0.9rem;

}

.music{

margin-top:20px;

}

</style>
</head>
<body>
  <div class="hearts"></div>
  <section class="hero">

<h1>Happy Anniversary, Isubilo ❤️</h1>

   <div class="subtitle">

Every moment with you feels like home. <br><br>
